name: Backend CI

on:
  push:
    branches: ['main']
    paths: ['MAM-Meditation-App/MAM-Project/backend/**']
  pull_request:
    branches: ['main']
    paths: ['MAM-Meditation-App/MAM-Project/backend/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    defaults:
      run:
        working-directory: ./MAM-Meditation-App/MAM-Project/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'MAM-Meditation-App/MAM-Project/backend/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-key' }}
          PORT: 3000
          NODE_ENV: test
